# add_header is not inherited by locations that set their own, so this file is included wherever needed.
# style-src 'unsafe-inline': styled-components injects <style> tags. img-src data: covers inlined assets.
# connect-src 'self': the API is reached through this server's proxy.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
